[package]
name = "ritmo"
version = "0.1.0"
description = "Ritmo desktop shell"
authors = ["Ritmo"]
edition = "2021"

[lib]
name = "ritmo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "3"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2.5.5"
